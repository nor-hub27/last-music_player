<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nor player</title>
<link rel="icon" type="image/png" href="/icon.png">
<style>
:root {
  --bg: #0a0a0f;
  --fg: #f4f4f7;
  --muted: #9a9aa8;
  --accent: #7dd3fc;
  --card-bg: rgba(255, 255, 255, 0.05);
  --card-border: rgba(255, 255, 255, 0.08);
  --hover-bg: rgba(255, 255, 255, 0.10);
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  margin: 0;
  height: 100%;
  width: 100%;
  overflow: hidden;
  font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
  color: var(--fg);
  background: radial-gradient(circle at 20% 30%, rgba(125, 211, 252, 0.08) 0%, #0a0a0f 70%) #0a0a0f;
  user-select: none;
  -webkit-user-select: none;
}

#app {
  display: flex;
  width: 100%;
  height: 100%;
  padding: 32px 40px;
  gap: 36px;
  overflow: hidden;
  align-items: stretch;
}

@media (max-width: 900px) {
  #app {
    flex-direction: column;
    padding: 16px;
    gap: 16px;
    overflow-y: auto;
  }
}

/* ================= LEFT COLUMN: Now Playing ================= */
.player-col {
  flex: 5;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  max-width: 520px;
  margin: 0 auto;
  width: 100%;
}

.cover-wrapper {
  width: min(340px, 60vmin);
  height: min(340px, 60vmin);
  margin-bottom: 24px;
  position: relative;
  border-radius: 24px;
  overflow: hidden;
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), 0 0 35px rgba(125, 211, 252, 0.15);
  background: rgba(255, 255, 255, 0.03);
}

.app-cover-title {
  position: absolute;
  top: 14px;
  left: 14px;
  z-index: 10;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 6px 14px;
  background: rgba(10, 10, 15, 0.78);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 12px;
  color: #ffffff;
  font-size: 11pt;
  font-weight: 700;
  letter-spacing: 0.3px;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
  pointer-events: none;
  user-select: none;
}

.app-cover-title svg {
  color: var(--accent);
}

.cover-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.2);
}

.cover-pop {
  animation: coverPop 0.35s cubic-bezier(0.2, 0.9, 0.3, 1.2);
}

@keyframes coverPop {
  0% { transform: scale(0.92); opacity: 0.8; }
  50% { transform: scale(1.03); }
  100% { transform: scale(1); opacity: 1; }
}

.track-title {
  font-size: clamp(16pt, 2.6vmin, 20pt);
  font-weight: 700;
  text-align: center;
  width: 100%;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  padding: 0 10px;
  color: var(--fg);
  letter-spacing: -0.3px;
}

.track-subtitle {
  font-size: 10pt;
  color: var(--muted);
  text-align: center;
  margin-top: 6px;
  margin-bottom: 24px;
  width: 100%;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  padding: 0 10px;
}

/* Seek Slider Row */
.slider-row {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  margin-bottom: 18px;
}

.time-label {
  font-size: 8.5pt;
  color: var(--muted);
  min-width: 38px;
  font-variant-numeric: tabular-nums;
}

.time-label.right {
  text-align: right;
}

.seek-track {
  flex: 1;
  height: 28px;
  display: flex;
  align-items: center;
  cursor: pointer;
  position: relative;
}

.seek-groove {
  width: 100%;
  height: 5px;
  background: rgba(255, 255, 255, 0.12);
  border-radius: 3px;
  position: relative;
  overflow: visible;
}

.seek-fill {
  position: absolute;
  left: 0;
  top: 0;
  height: 100%;
  width: 0%;
  background: var(--accent);
  border-radius: 3px;
  pointer-events: none;
}

.seek-thumb {
  position: absolute;
  top: 50%;
  left: 0%;
  width: 13px;
  height: 13px;
  background: #ffffff;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  box-shadow: 0 0 8px rgba(125, 211, 252, 0.8);
  pointer-events: none;
  transition: transform 0.1s;
}

.seek-track:hover .seek-thumb {
  transform: translate(-50%, -50%) scale(1.25);
}

/* Controls Row */
.controls-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  width: 100%;
  margin-bottom: 20px;
}

.btn-icon {
  background: transparent;
  border: none;
  color: var(--muted);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  transition: all 0.15s ease;
  position: relative;
}

.btn-icon:hover {
  color: var(--fg);
  background: var(--hover-bg);
}

.btn-icon:active {
  transform: scale(0.92);
}

.btn-icon.active {
  color: var(--accent);
}

.active-dot {
  position: absolute;
  bottom: 6px;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--accent);
}

.btn-play {
  width: 58px;
  height: 58px;
  border-radius: 50%;
  background: var(--accent);
  color: #0a0a0f;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 6px 20px rgba(125, 211, 252, 0.4);
  transition: transform 0.15s, background 0.15s;
}

.btn-play:hover {
  transform: scale(1.06);
  background: #93ddfd;
}

.btn-play:active {
  transform: scale(0.95);
}

/* Volume Row */
.vol-box {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 75%;
  max-width: 280px;
}

.vol-icon {
  background: transparent;
  border: none;
  color: var(--muted);
  cursor: pointer;
  padding: 4px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: color 0.15s;
}

.vol-icon:hover {
  color: var(--fg);
}

.vol-slider-wrap {
  flex: 1;
  height: 28px;
  display: flex;
  align-items: center;
  cursor: pointer;
  touch-action: none;
  position: relative;
  user-select: none;
  -webkit-user-select: none;
}

.vol-slider-wrap .seek-fill,
.vol-slider-wrap .seek-thumb {
  transition: width 0.08s ease-out, left 0.08s ease-out;
}

.vol-slider-wrap.dragging .seek-fill,
.vol-slider-wrap.dragging .seek-thumb {
  transition: none !important;
}

.vol-slider-wrap:hover .seek-thumb,
.vol-slider-wrap.dragging .seek-thumb {
  transform: translate(-50%, -50%) scale(1.3);
}

/* ================= RIGHT COLUMN: Queue & Lyrics Card ================= */
.panel-card {
  flex: 6;
  display: flex;
  flex-direction: column;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  border-radius: 20px;
  padding: 24px;
  overflow: hidden;
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  min-height: 0;
}

.panel-head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 16px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  padding-bottom: 12px;
}

.tab-btn {
  background: transparent;
  border: none;
  color: var(--muted);
  font-size: 11pt;
  font-weight: 600;
  padding: 8px 16px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.15s;
}

.tab-btn:hover {
  color: var(--fg);
  background: var(--hover-bg);
}

.tab-btn.active {
  color: var(--fg);
  background: rgba(255, 255, 255, 0.12);
}

.count-label {
  margin-left: auto;
  font-size: 9.5pt;
  color: var(--muted);
}

.tab-pane {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* Track List in Queue */
.track-list {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding-right: 6px;
}

.track-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border-radius: 12px;
  cursor: pointer;
  background: rgba(255, 255, 255, 0.02);
  border: 1px solid transparent;
  transition: all 0.15s ease;
}

.track-item:hover {
  background: var(--hover-bg);
  border-color: rgba(255, 255, 255, 0.06);
}

.track-item.selected {
  background: rgba(125, 211, 252, 0.12);
  border-color: rgba(125, 211, 252, 0.3);
}

.track-thumb {
  width: 44px;
  height: 44px;
  border-radius: 8px;
  overflow: hidden;
  background: rgba(255, 255, 255, 0.05);
  flex-shrink: 0;
}

.track-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.track-info {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.track-name {
  font-size: 10.5pt;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--fg);
}

.track-name.playing {
  color: var(--accent);
  font-weight: 600;
}

.track-meta {
  font-size: 8.5pt;
  color: var(--muted);
  margin-top: 2px;
}

/* Equalizer Animation */
.eq-bars {
  display: flex;
  align-items: center;
  gap: 2.5px;
  height: 20px;
  padding-right: 6px;
}

.eq-bar {
  width: 3.5px;
  background: var(--accent);
  border-radius: 1.7px;
  animation: eqBounce 0.8s ease-in-out infinite alternate;
}

.eq-bar:nth-child(1) { height: 10px; animation-delay: 0.1s; }
.eq-bar:nth-child(2) { height: 18px; animation-delay: 0.3s; }
.eq-bar:nth-child(3) { height: 13px; animation-delay: 0.2s; }

@keyframes eqBounce {
  0% { transform: scaleY(0.4); }
  100% { transform: scaleY(1.1); }
}

/* Bottom Action Buttons */
.queue-actions {
  display: flex;
  gap: 8px;
  margin-top: 10px;
  flex-wrap: wrap;
}

.btn-pill-pri {
  background: rgba(125, 211, 252, 0.18);
  color: var(--accent);
  border: none;
  border-radius: 16px;
  padding: 8px 16px;
  font-size: 9.5pt;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s, transform 0.1s;
}

.btn-pill-pri:hover {
  background: rgba(125, 211, 252, 0.28);
}

.btn-pill-pri:active {
  transform: scale(0.96);
}

.btn-pill {
  background: rgba(255, 255, 255, 0.08);
  color: var(--fg);
  border: none;
  border-radius: 16px;
  padding: 8px 16px;
  font-size: 9.5pt;
  cursor: pointer;
  transition: background 0.15s, transform 0.1s;
}

.btn-pill:hover {
  background: rgba(255, 255, 255, 0.15);
}

.btn-pill:active {
  transform: scale(0.96);
}

/* ================= Lyrics Tab ================= */
.lyrics-status {
  color: var(--muted);
  font-size: 10pt;
  text-align: center;
  margin-bottom: 8px;
}

#ly-container {
  flex: 1;
  min-height: 0;
  overflow: hidden;
  position: relative;
  text-align: center;
  -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 18%, black 82%, transparent 100%);
  mask-image: linear-gradient(to bottom, transparent 0%, black 18%, black 82%, transparent 100%);
}

#ly-track {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  padding: 40vh 12px;
  position: relative;
  transition: transform 0.65s cubic-bezier(0.2, 0.9, 0.3, 1);
  will-change: transform;
}

.ly-line {
  margin: 0;
  padding: 10px 16px;
  font-size: clamp(18px, 2.8vmin, 26px);
  color: var(--muted);
  opacity: 0.35;
  filter: blur(0.3px);
  transform: scale(0.94);
  transform-origin: center center;
  transition: all 0.5s cubic-bezier(0.2, 0.9, 0.3, 1);
  cursor: pointer;
  user-select: none;
  line-height: 1.35;
  border-radius: 12px;
  width: 100%;
}

.ly-line:hover {
  opacity: 0.75;
  filter: none;
}

/* Highlighted White Active Lyric */
.ly-line.on {
  color: #ffffff !important;
  opacity: 1 !important;
  filter: none !important;
  transform: scale(1.1) !important;
  font-weight: 700 !important;
  text-shadow: 0 0 20px rgba(255, 255, 255, 0.7), 0 0 40px rgba(255, 255, 255, 0.35) !important;
}

.lyrics-actions {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-top: 10px;
  flex-wrap: wrap;
}

#toast {
  position: fixed;
  left: 50%;
  bottom: 24px;
  transform: translate(-50%, 10px);
  background: var(--fg);
  color: var(--bg);
  padding: 9px 18px;
  border-radius: 999px;
  font-size: 14px;
  opacity: 0;
  pointer-events: none;
  transition: all 0.25s ease;
  z-index: 9999;
  font-weight: 500;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
}

#toast.show {
  opacity: 1;
  transform: translate(-50%, 0);
}

::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.16); border-radius: 4px; }
</style>
</head>
<body>

<div id="app">
  <!-- LEFT COLUMN: Now playing -->
  <div class="player-col">
    <div class="cover-wrapper">
      <div class="app-cover-title">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
        </svg>
        Nor player
      </div>
      <img id="cover-img" class="cover-img" src="/cover.jpg" alt="Cover Art">
    </div>

    <div class="track-title" id="track-title">Loading Music...</div>
    <div class="track-subtitle" id="track-subtitle">Preparing queue</div>

    <!-- Seek Slider Row -->
    <div class="slider-row">
      <span class="time-label" id="time-cur">0:00</span>
      <div class="seek-track" id="seek-track">
        <div class="seek-groove">
          <div class="seek-fill" id="seek-fill"></div>
          <div class="seek-thumb" id="seek-thumb"></div>
        </div>
      </div>
      <span class="time-label right" id="time-tot">0:00</span>
    </div>

    <!-- Controls Row -->
    <div class="controls-row">
      <button class="btn-icon" id="btn-shuffle" type="button" title="Shuffle">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="16 3 21 3 21 8"></polyline>
          <line x1="4" y1="20" x2="21" y2="3"></line>
          <polyline points="21 16 21 21 16 21"></polyline>
          <line x1="15" y1="15" x2="21" y2="21"></line>
          <line x1="4" y1="4" x2="9" y2="9"></line>
        </svg>
        <span class="active-dot" id="shuf-dot" style="display:none"></span>
      </button>

      <button class="btn-icon" id="btn-prev" type="button" title="Previous">
        <svg width="24" height="24" viewBox="0 0 64 64" fill="currentColor">
          <rect x="14" y="16" width="6" height="32" rx="2"></rect>
          <polygon points="50,16 50,48 24,32"></polygon>
        </svg>
      </button>

      <button class="btn-play" id="btn-play" type="button" title="Play / Pause">
        <svg id="icon-play" width="28" height="28" viewBox="0 0 64 64" fill="currentColor" style="margin-left:3px">
          <polygon points="22,14 22,50 52,32"></polygon>
        </svg>
        <svg id="icon-pause" width="28" height="28" viewBox="0 0 64 64" fill="currentColor" style="display:none">
          <rect x="18" y="14" width="10" height="36" rx="3"></rect>
          <rect x="36" y="14" width="10" height="36" rx="3"></rect>
        </svg>
      </button>

      <button class="btn-icon" id="btn-next" type="button" title="Next">
        <svg width="24" height="24" viewBox="0 0 64 64" fill="currentColor">
          <rect x="44" y="16" width="6" height="32" rx="2"></rect>
          <polygon points="14,16 14,48 40,32"></polygon>
        </svg>
      </button>

      <button class="btn-icon" id="btn-repeat" type="button" title="Repeat">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="17 1 21 5 17 9"></polyline>
          <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
          <polyline points="7 23 3 19 7 15"></polyline>
          <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
        </svg>
        <span id="rep-one-badge" style="position:absolute;font-size:9px;font-weight:700;top:18px;display:none">1</span>
        <span class="active-dot" id="rep-dot" style="display:none"></span>
      </button>
    </div>

    <!-- Volume Row -->
    <div class="vol-box">
      <button class="vol-icon" id="btn-mute" type="button" title="Mute">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="4,9.5 8,9.5 13,5.5 13,18.5 8,14.5 4,14.5"></polygon>
          <path d="M16 9 A5 5 0 0 1 16 15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
        </svg>
      </button>
      <div class="vol-slider-wrap" id="vol-slider-wrap">
        <div class="seek-groove">
          <div class="seek-fill" id="vol-fill" style="width:60%"></div>
          <div class="seek-thumb" id="vol-thumb" style="left:60%"></div>
        </div>
      </div>
      <button class="vol-icon" id="btn-full-vol" type="button" title="Full Volume">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <polygon points="4,9.5 8,9.5 13,5.5 13,18.5 8,14.5 4,14.5"></polygon>
          <path d="M16 9 A5 5 0 0 1 16 15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
          <path d="M19 6 A9 9 0 0 1 19 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
        </svg>
      </button>
    </div>
  </div>

  <!-- RIGHT COLUMN: Queue & Lyrics Card -->
  <div class="panel-card">
    <div class="panel-head">
      <button class="tab-btn active" id="tab-queue-btn" type="button">Queue</button>
      <button class="tab-btn" id="tab-lyrics-btn" type="button">Lyrics</button>
      <span class="count-label" id="queue-count"></span>
    </div>

    <!-- Tab 1: Queue -->
    <div class="tab-pane" id="pane-queue">
      <div class="track-list" id="track-list"></div>
      <div class="queue-actions">
        <button class="btn-pill-pri" id="btn-add-files" type="button">＋ Files</button>
        <button class="btn-pill-pri" id="btn-add-folder" type="button">＋ Folder</button>
        <button class="btn-pill" id="btn-remove" type="button">Remove</button>
        <button class="btn-pill" id="btn-clear" type="button">Clear</button>
      </div>
    </div>

    <!-- Tab 2: Lyrics -->
    <div class="tab-pane" id="pane-lyrics" style="display:none">
      <div class="lyrics-status" id="lyrics-status">Play a song to see its lyrics</div>
      <div id="ly-container">
        <div id="ly-track"></div>
      </div>
      <div class="lyrics-actions">
        <button class="btn-pill-pri" id="btn-translate" type="button">Translate to EN</button>
        <button class="btn-pill" id="btn-find-online" type="button">Find lyrics online</button>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<!-- Hidden inputs for adding files/folders reliably -->
<input id="input-files" type="file" multiple accept="audio/*,.mp3,.wav,.ogg,.flac,.m4a,.opus,.aac,.webm,.mp4,.lrc,.txt" style="display:none">
<input id="input-folder" type="file" webkitdirectory directory mozdirectory multiple accept="audio/*,.mp3,.wav,.ogg,.flac,.m4a,.opus,.aac,.webm,.mp4,.lrc,.txt" style="display:none">

<script>
// ================= SOUND & SYNTH ENGINE (Audible offline tracks) =================
function createSynthesizedAudio(type) {
  const sampleRate = 22050;
  const duration = 48; // 48 seconds
  const numSamples = sampleRate * duration;
  const buffer = new ArrayBuffer(44 + numSamples * 2);
  const view = new DataView(buffer);

  const writeString = (offset, str) => {
    for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
  };
  writeString(0, 'RIFF');
  view.setUint32(4, 36 + numSamples * 2, true);
  writeString(8, 'WAVE');
  writeString(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true); // PCM
  view.setUint16(22, 1, true); // Mono
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * 2, true);
  view.setUint16(32, 2, true);
  view.setUint16(34, 16, true);
  writeString(36, 'data');
  view.setUint32(40, numSamples * 2, true);

  const chords = type === 0
    ? [220, 261.63, 329.63, 392.00] // Am7
    : type === 1
    ? [174.61, 220, 261.63, 329.63] // Fmaj7
    : [196.00, 246.94, 293.66, 349.23]; // G7

  for (let i = 0; i < numSamples; i++) {
    const t = i / sampleRate;
    const chordIdx = Math.floor(t / 4) % chords.length;
    const f = chords[chordIdx];
    const env = Math.min(1, Math.sin((t % 4) / 4 * Math.PI));
    const s1 = Math.sin(2 * Math.PI * f * t);
    const s2 = 0.5 * Math.sin(2 * Math.PI * (f * 1.5) * t);
    const s3 = 0.25 * Math.sin(2 * Math.PI * (f * 2) * t);
    const sample = (s1 + s2 + s3) * 0.35 * env;
    const intSample = Math.max(-32768, Math.min(32767, sample * 32767));
    view.setInt16(44 + i * 2, intSample, true);
  }

  const blob = new Blob([buffer], { type: 'audio/wav' });
  return URL.createObjectURL(blob);
}

function toast(msg) {

const fmt = sec => {
  if (isNaN(sec) || sec <= 0) return '0:00';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m}:${s < 10 ? '0' : ''}${s}`;
};

// ================= PLAYBACK CONTROLS =================
function playTrack(idx, recordHist = true) {
  if (!playlist.length) return;
  const safeIdx = (idx + playlist.length) % playlist.length;
  const track = playlist[safeIdx];
  if (!track) return;

  if (isShuffle && recordHist && currentIndex !== safeIdx) {
    history.push(currentIndex);
    if (history.length > 50) history.shift();
  }

  currentIndex = safeIdx;
  $('track-title').textContent = track.title || track.name.replace(/\.[^/.]+$/, '');
  $('track-subtitle').textContent = track.artist ? `${track.artist} · Track ${safeIdx + 1} of ${playlist.length}` : `Track ${safeIdx + 1} of ${playlist.length}`;

  const cover = $('cover-img');
  cover.src = track.art || '/cover.jpg';
  cover.onerror = () => { cover.src = '/cover.jpg'; };
  cover.classList.remove('cover-pop');
  void cover.offsetWidth;
  cover.classList.add('cover-pop');

  audio.src = track.url;
  audio.load();
  audio.play().then(() => updatePlayIcon(true)).catch(() => updatePlayIcon(false));

  currentLyrics = track.lyrics || null;
  currentLyricIdx = -1;
  showLyrics(track);
  renderQueue();
}

function togglePlay() {
  if (!playlist.length) {
    toast('Queue is empty');
    return;
  }
  if (audio.paused) {
    if (!audio.src && playlist[currentIndex]) {
      playTrack(currentIndex);
    } else {
      audio.play().then(() => updatePlayIcon(true)).catch(() => playTrack(currentIndex));
    }
  } else {
    audio.pause();
    updatePlayIcon(false);
  }
}

function nextTrack() {
  if (!playlist.length) return;
  if (isShuffle && playlist.length > 1) {
    let next = Math.floor(Math.random() * playlist.length);
    while (next === currentIndex) next = Math.floor(Math.random() * playlist.length);
    playTrack(next);
  } else {
    playTrack((currentIndex + 1) % playlist.length);
  }
}

function prevTrack() {
  if (!playlist.length) return;
  if (audio.currentTime > 3) {
    audio.currentTime = 0;
    return;
  }
  if (isShuffle && history.length > 0) {
    playTrack(history.pop(), false);
    return;
  }
  playTrack((currentIndex - 1 + playlist.length) % playlist.length);
}

function updatePlayIcon(isPlaying) {
  $('icon-play').style.display = isPlaying ? 'none' : 'block';
  $('icon-pause').style.display = isPlaying ? 'block' : 'none';
  renderQueue();
}

// Audio Listeners
audio.addEventListener('play', () => updatePlayIcon(true));
audio.addEventListener('pause', () => updatePlayIcon(false));
audio.addEventListener('timeupdate', () => {
  const cur = audio.currentTime;
  const dur = audio.duration || 0;
  $('time-cur').textContent = fmt(cur);
  $('time-tot').textContent = fmt(dur);
  const pct = dur > 0 ? (cur / dur) * 100 : 0;
  $('seek-fill').style.width = `${pct}%`;
  $('seek-thumb').style.left = `${pct}%`;
  syncLyrics(cur);
});

audio.addEventListener('loadedmetadata', () => {
  $('time-tot').textContent = fmt(audio.duration || 0);
});

audio.addEventListener('ended', () => {
  if (!playlist.length) return;
  if (repeatMode === 'one') {
    audio.currentTime = 0;
    audio.play().catch(() => {});
    return;
  }
  if (repeatMode === 'off' && currentIndex === playlist.length - 1 && !isShuffle) {
    updatePlayIcon(false);
    return;
  }
  nextTrack();
});

// ================= SEEK & VOLUME =================
$('seek-track').addEventListener('click', e => {
  if (!audio.duration) return;
  const rect = e.currentTarget.getBoundingClientRect();
  const ratio = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  audio.currentTime = ratio * audio.duration;
});

let currentVol = 60;

function setVolume(pct, updateAudio = true) {
  const safe = Math.max(0, Math.min(100, pct));
  currentVol = safe;
  if (updateAudio) {
    audio.volume = safe / 100;
  }
  const fill = $('vol-fill');
  const thumb = $('vol-thumb');
  if (fill) fill.style.width = `${safe.toFixed(2)}%`;
  if (thumb) thumb.style.left = `${safe.toFixed(2)}%`;
}

const volWrap = $('vol-slider-wrap');
let isVolDragging = false;

function updateVolFromEvent(e) {
  const rect = volWrap.getBoundingClientRect();
  if (rect.width <= 0) return;
  const clientX = e.clientX !== undefined ? e.clientX : (e.touches && e.touches[0] ? e.touches[0].clientX : 0);
  const ratio = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
  setVolume(ratio * 100);
}

volWrap.addEventListener('pointerdown', e => {
  isVolDragging = true;
  volWrap.classList.add('dragging');
  try { volWrap.setPointerCapture(e.pointerId); } catch(err) {}
  updateVolFromEvent(e);
});

volWrap.addEventListener('pointermove', e => {
  if (!isVolDragging) return;
  updateVolFromEvent(e);
});

function endVolDrag(e) {
  if (isVolDragging) {
    isVolDragging = false;
    volWrap.classList.remove('dragging');
    if (e && e.pointerId) {
      try { volWrap.releasePointerCapture(e.pointerId); } catch(err) {}
    }
  }
}

volWrap.addEventListener('pointerup', endVolDrag);
volWrap.addEventListener('pointercancel', endVolDrag);
window.addEventListener('pointerup', endVolDrag);

$('btn-mute').addEventListener('click', () => {
  volWrap.classList.remove('dragging');
  setVolume(0);
});

$('btn-full-vol').addEventListener('click', () => {
  volWrap.classList.remove('dragging');
  setVolume(100);
});

// Fast and accurate binary signature scanner for embedded album images
function findImageInBytes(fData) {
  if (!fData || fData.length < 4) return null;
  // 1. JPEG: 0xFF, 0xD8, 0xFF
  for (let i = 0; i < fData.length - 3; i++) {
    if (fData[i] === 0xFF && fData[i+1] === 0xD8 && fData[i+2] === 0xFF) {
      return { start: i, mime: 'image/jpeg' };
    }
  }
  // 2. PNG: 0x89, 0x50, 0x4E, 0x47
  for (let i = 0; i < fData.length - 4; i++) {
    if (fData[i] === 0x89 && fData[i+1] === 0x50 && fData[i+2] === 0x4E && fData[i+3] === 0x47) {
      return { start: i, mime: 'image/png' };
    }
  }
  // 3. WEBP: RIFF ... WEBP
  for (let i = 0; i < fData.length - 12; i++) {
    if (fData[i] === 0x52 && fData[i+1] === 0x49 && fData[i+2] === 0x46 && fData[i+3] === 0x46 &&
        fData[i+8] === 0x57 && fData[i+9] === 0x45 && fData[i+10] === 0x42 && fData[i+11] === 0x50) {
      return { start: i, mime: 'image/webp' };
    }
  }
  // 4. GIF: GIF87a or GIF89a
  for (let i = 0; i < fData.length - 4; i++) {
    if (fData[i] === 0x47 && fData[i+1] === 0x49 && fData[i+2] === 0x46 && fData[i+3] === 0x38) {
      return { start: i, mime: 'image/gif' };
    }
  }
  return null;
}

// Extract embedded Cover Art (ID3v2 APIC / FLAC / M4A) and Lyrics (USLT)
async function extractAudioMetadata(file) {
  let art = null;
  let lyrics = null;
  let title = '';
  let artist = '';

  try {
    if (!file || typeof file.slice !== 'function') return { art, lyrics, title, artist };
    const slice = file.slice(0, Math.min(file.size || 0, 16 * 1024 * 1024));
    const buf = await slice.arrayBuffer();
    const bytes = new Uint8Array(buf);
    const view = new DataView(buf);

    // 1. ID3v2 (MP3) - search within first 4KB for ID3 header
    let id3Off = -1;
    for (let i = 0; i <= Math.min(bytes.length - 10, 4096); i++) {
      if (bytes[i] === 0x49 && bytes[i+1] === 0x44 && bytes[i+2] === 0x33) {
        id3Off = i;
        break;
      }
    }

    if (id3Off >= 0) {
      const ver = bytes[id3Off + 3];
      const tagSize = ((bytes[id3Off+6] & 0x7f) << 21) | ((bytes[id3Off+7] & 0x7f) << 14) | ((bytes[id3Off+8] & 0x7f) << 7) | (bytes[id3Off+9] & 0x7f);
      const maxOff = Math.min(id3Off + 10 + tagSize, bytes.length);
      let off = id3Off + 10;

      while (off < maxOff - 10) {
        let id, fSize, hSize;
        if (ver === 2) {
          id = String.fromCharCode(bytes[off], bytes[off+1], bytes[off+2]);
          fSize = (bytes[off+3] << 16) | (bytes[off+4] << 8) | bytes[off+5];
          hSize = 6;
        } else {
          id = String.fromCharCode(bytes[off], bytes[off+1], bytes[off+2], bytes[off+3]);
          fSize = ver === 4 
            ? (((bytes[off+4] & 0x7f) << 21) | ((bytes[off+5] & 0x7f) << 14) | ((bytes[off+6] & 0x7f) << 7) | (bytes[off+7] & 0x7f))
            : view.getUint32(off + 4);
          hSize = 10;
        }
        if (fSize <= 0 || off + hSize + fSize > bytes.length) break;

        const fData = bytes.subarray(off + hSize, off + hSize + fSize);

        // APIC / PIC (Album Art)
        if ((id === 'APIC' || id === 'PIC') && !art) {
          try {
            const found = findImageInBytes(fData);
            if (found) {
              const imgBytes = fData.slice(found.start);
              art = URL.createObjectURL(new Blob([imgBytes], { type: found.mime }));
            } else {
              const enc = fData[0];
              let pOff = id === 'APIC' ? 1 : 4;
              if (id === 'APIC') {
                while (pOff < fData.length && fData[pOff] !== 0) pOff++;
                pOff++;
              }
              pOff++; // pic type
              if (enc === 0 || enc === 3) {
                while (pOff < fData.length && fData[pOff] !== 0) pOff++;
                pOff++;
              } else {
                while (pOff < fData.length - 1 && !(fData[pOff] === 0 && fData[pOff+1] === 0)) pOff += 2;
                pOff += 2;
              }
              if (pOff < fData.length) {
                const imgBytes = fData.slice(pOff);
                art = URL.createObjectURL(new Blob([imgBytes], { type: 'image/jpeg' }));
              }
            }
          } catch(e) {}
        }

        // USLT / ULT (Embedded lyrics)
        if ((id === 'USLT' || id === 'ULT') && !lyrics) {
          try {
            const enc = fData[0];
            let lOff = 4;
            if (enc === 0 || enc === 3) {
              while (lOff < fData.length && fData[lOff] !== 0) lOff++;
              lOff++;
            } else {
              while (lOff < fData.length - 1 && !(fData[lOff] === 0 && fData[lOff+1] === 0)) lOff += 2;
              lOff += 2;
            }
            const lBytes = fData.subarray(lOff);
            const dec = new TextDecoder(enc === 1 ? 'utf-16' : 'utf-8').decode(lBytes);
            if (dec.trim()) lyrics = parseLrc(dec);
          } catch(e) {}
        }

        // TIT2 / TT2 (Title)
        if ((id === 'TIT2' || id === 'TT2') && !title) {
          try {
            const enc = fData[0];
            title = new TextDecoder(enc === 1 ? 'utf-16' : 'utf-8').decode(fData.subarray(1)).replace(/\0/g, '').trim();
          } catch(e) {}
        }

        // TPE1 / TP1 (Artist)
        if ((id === 'TPE1' || id === 'TP1') && !artist) {
          try {
            const enc = fData[0];
            artist = new TextDecoder(enc === 1 ? 'utf-16' : 'utf-8').decode(fData.subarray(1)).replace(/\0/g, '').trim();
          } catch(e) {}
        }

        off += hSize + fSize;
      }
    }
    // 2. FLAC
    else if (bytes[0] === 0x66 && bytes[1] === 0x4c && bytes[2] === 0x61 && bytes[3] === 0x43) {
      let fOff = 4;
      while (fOff < bytes.length - 4) {
        const isLast = (bytes[fOff] & 0x80) !== 0;
        const bType = bytes[fOff] & 0x7f;
        const bSize = (bytes[fOff+1] << 16) | (bytes[fOff+2] << 8) | bytes[fOff+3];
        fOff += 4;
        if (bType === 6 && !art) {
          try {
            const fBlock = bytes.subarray(fOff, fOff + bSize);
            const found = findImageInBytes(fBlock);
            if (found) {
              const imgBytes = fBlock.slice(found.start);
              art = URL.createObjectURL(new Blob([imgBytes], { type: found.mime }));
            } else {
              const mimeLen = view.getUint32(fOff + 4);
              const descLen = view.getUint32(fOff + 8 + mimeLen);
              const dOff = fOff + 8 + mimeLen + 4 + descLen + 16;
              const dLen = view.getUint32(dOff);
              const imgBytes = bytes.slice(dOff + 4, dOff + 4 + dLen);
              art = URL.createObjectURL(new Blob([imgBytes], { type: 'image/jpeg' }));
            }
          } catch(e) {}
        }
        fOff += bSize;
        if (isLast) break;
      }
    }
    // 3. M4A / MP4 ('covr' atom)
    if (!art && (file.name.match(/\.(m4a|mp4|aac)$/i) || (bytes.length > 8 && bytes[4] === 0x66 && bytes[5] === 0x74 && bytes[6] === 0x79 && bytes[7] === 0x70))) {
      for (let i = 0; i < bytes.length - 16; i++) {
        if (bytes[i] === 0x63 && bytes[i+1] === 0x6f && bytes[i+2] === 0x76 && bytes[i+3] === 0x72) { // 'covr'
          const found = findImageInBytes(bytes.subarray(i, Math.min(i + 2048, bytes.length)));
          if (found) {
            const imgBytes = bytes.slice(i + found.start);
            art = URL.createObjectURL(new Blob([imgBytes], { type: found.mime }));
            break;
          }
          for (let j = i + 4; j < Math.min(i + 32, bytes.length - 12); j++) {
            if (bytes[j] === 0x64 && bytes[j+1] === 0x61 && bytes[j+2] === 0x74 && bytes[j+3] === 0x61) { // 'data'
              const dataLen = view.getUint32(j - 4);
              const dataType = view.getUint32(j + 4);
              const mime = dataType === 14 ? 'image/png' : 'image/jpeg';
              const imgBytes = bytes.slice(j + 12, j - 4 + dataLen);
              if (imgBytes.length > 0) {
                art = URL.createObjectURL(new Blob([imgBytes], { type: mime }));
              }
              break;
            }
          }
          if (art) break;
        }
      }
    }
  } catch(e) {}

  return { art, lyrics, title, artist };
}

// Add Local Audio Files
async function addFiles(files) {
  if (!files) return;
  const fileArr = Array.from(files);
  if (!fileArr.length) return;

  // Check if a single image file was added or dropped to update cover art directly
  if (fileArr.length === 1 && /\.(jpg|jpeg|png|webp|gif)$/i.test(fileArr[0].name)) {
    try {
      const imgUrl = URL.createObjectURL(fileArr[0]);
      if (playlist[currentIndex]) {
        playlist[currentIndex].art = imgUrl;
        $('cover-img').src = imgUrl;
        renderQueue();
        toast('Cover art updated');
        return;
      }
    } catch(e) {}
  }

  // Look for any accompanying cover image file (cover.jpg, folder.jpg, album.jpg, etc.)
  const imageFiles = fileArr.filter(f => f && f.name && /\.(jpg|jpeg|png|webp|gif)$/i.test(f.name));
  let folderArtUrl = null;
  if (imageFiles.length) {
    const preferred = imageFiles.find(f => /(cover|folder|front|album|art)/i.test(f.name)) || imageFiles[0];
    try {
      folderArtUrl = URL.createObjectURL(preferred);
    } catch(e) {}
  }

  const lrcFiles = fileArr.filter(f => f && f.name && /\.(lrc|txt)$/i.test(f.name));
  const lrcMap = {};
  for (const lf of lrcFiles) {
    try {
      if (typeof lf.text === 'function') {
        const text = await lf.text();
        const base = lf.name.replace(/\.[^/.]+$/, '').toLowerCase();
        lrcMap[base] = text;
      }
    } catch(e) {}
  }

  const valid = fileArr.filter(f => {
    if (!f) return false;
    const fType = f.type && typeof f.type === 'string' ? f.type : '';
    const fName = f.name && typeof f.name === 'string' ? f.name : '';
    return fType.startsWith('audio/') || /\.(mp3|wav|ogg|flac|m4a|opus|aac|webm|mp4)$/i.test(fName);
  });

  if (!valid.length) {
    toast('No supported audio files found');
    return;
  }

  toast(`Loading ${valid.length} audio file${valid.length === 1 ? '' : 's'}…`);

  const newTracks = [];
  for (let idx = 0; idx < valid.length; idx++) {
    const f = valid[idx];
    try {
      const fName = f.name || `Track ${idx + 1}`;
      const clean = fName.replace(/\.[^/.]+$/, '');
      const parts = clean.split(' - ');

      let meta = { art: null, lyrics: null, title: '', artist: '' };
      try {
        meta = await extractAudioMetadata(f);
      } catch(e) {}

      let lyr = meta.lyrics;
      const baseKey = clean.toLowerCase();
      if (!lyr && lrcMap[baseKey]) {
        try {
          lyr = parseLrc(lrcMap[baseKey]);
        } catch(e) {}
      }

      let url = '';
      if (f instanceof Blob || f instanceof File) {
        url = URL.createObjectURL(f);
      } else if (f.url) {
        url = f.url;
      }

      if (url) {
        newTracks.push({
          id: `local-${Date.now()}-${idx}-${Math.random().toString(36).slice(2, 6)}`,
          name: fName,
          title: meta.title || (parts.length > 1 ? parts[1].trim() : clean),
          artist: meta.artist || (parts.length > 1 ? parts[0].trim() : ''),
          url: url,
          art: meta.art || folderArtUrl || null,
          lyrics: lyr || null
        });
      }
    } catch(err) {
      console.warn('Skipping unreadable track:', err);
    }
  }

  if (!newTracks.length) {
    toast('Could not read audio files');
    return;
  }

  const startIdx = playlist.length;
  playlist = [...playlist, ...newTracks];
  renderQueue();
  playTrack(startIdx);
  toast(`Added ${newTracks.length} song${newTracks.length === 1 ? '' : 's'}`);
}

async function handleCapacitorFiles(capFiles) {
  const plugin = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.FolderPicker;
  if (!plugin || !capFiles || !capFiles.length) return;
  toast('Loading tracks from folder…');

  const audioItems = capFiles.filter(f => f && f.name && /\.(mp3|wav|ogg|flac|m4a|opus|aac|webm|mp4)$/i.test(f.name));
  if (!audioItems.length) {
    toast('No audio files found in folder');
    return;
  }

  const startIdx = playlist.length;
  let addedCount = 0;

  for (const item of audioItems) {
    try {
      const cached = await plugin.cache({ uri: item.uri, name: item.name });
      if (cached && cached.path) {
        const playUrl = window.Capacitor.convertFileSrc(cached.path);
        const clean = item.name.replace(/\.[^/.]+$/, '');
        const parts = clean.split(' - ');
        playlist.push({
          id: `cap-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
          name: item.name,
          title: parts.length > 1 ? parts[1].trim() : clean,
          artist: parts.length > 1 ? parts[0].trim() : '',
          url: playUrl,
          art: null,
          lyrics: null
        });
        addedCount++;
        renderQueue();
      }
    } catch(e) {
      console.warn('Failed to cache track:', item.name, e);
    }
  }

  if (addedCount > 0) {
    renderQueue();
    playTrack(startIdx);
    toast(`Added ${addedCount} song${addedCount === 1 ? '' : 's'}`);
  } else {
    toast('Could not load songs from folder');
  }
}

$('btn-add-folder').addEventListener('click', async () => {
  // 1. Capacitor native FolderPicker if inside Android app
  if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.FolderPicker) {
    try {
      const res = await window.Capacitor.Plugins.FolderPicker.pick();
      if (res && res.files && res.files.length) {
        await handleCapacitorFiles(res.files);
        return;
      }
    } catch(e) {
      console.warn('FolderPicker fallback to input', e);
    }
  }

  // 2. Modern File System Access API (Chrome/Edge desktop) if supported & not restricted by iframe
  if (typeof window.showDirectoryPicker === 'function' && window.self === window.top) {
    try {
      const dirHandle = await window.showDirectoryPicker({ id: 'music_folder', mode: 'read' });
      const collectedFiles = [];
      async function scanDirectory(dir) {
        for await (const entry of dir.values()) {
          if (entry.kind === 'file') {
            try {
              const file = await entry.getFile();
              collectedFiles.push(file);
            } catch(e) {}
          } else if (entry.kind === 'directory') {
            try {
              await scanDirectory(entry);
            } catch(e) {}
          }
        }
      }
      toast('Scanning folder…');
      await scanDirectory(dirHandle);
      if (collectedFiles.length > 0) {
        await addFiles(collectedFiles);
        return;
      } else {
        toast('No audio files found in folder');
        return;
      }
    } catch(err) {
      if (err.name === 'AbortError') return;
      // Other error (e.g. security/iframe), fall through to input
    }
  }

  // 3. Fallback to HTML5 directory input (works across all standard browsers)
  const folderInp = $('input-folder');
  if (folderInp) {
    folderInp.value = '';
    folderInp.click();
  }
});

// Drag & drop support for both files and folders
window.addEventListener('dragover', e => e.preventDefault());
window.addEventListener('drop', async e => {
  e.preventDefault();
  const items = e.dataTransfer.items;
  if (items && items.length) {
    const files = [];
    async function traverseEntry(entry) {
      if (entry.isFile) {
        try {
          const file = await new Promise((res, rej) => entry.file(res, rej));
          files.push(file);
        } catch(e) {}
      } else if (entry.isDirectory) {
        const reader = entry.createReader();
        const readEntries = async () => {
          const batch = await new Promise((res, rej) => reader.readEntries(res, rej));
          if (batch && batch.length) {
            for (const child of batch) await traverseEntry(child);
            await readEntries();
          }
        };
        await readEntries();
      }
    }
    for (let i = 0; i < items.length; i++) {
      const entry = items[i].webkitGetAsEntry ? items[i].webkitGetAsEntry() : null;
      if (entry) {
        await traverseEntry(entry);
      } else {
        const f = items[i].getAsFile();
        if (f) files.push(f);
      }
    }
    if (files.length) {
      addFiles(files);
      return;
    }
  }
  if (e.dataTransfer.files && e.dataTransfer.files.length) {
    addFiles(e.dataTransfer.files);
  }
});

// ================= LYRICS & TRANSLATION ENGINE =================
function isFilipinoOrTagalog(text, artist, title) {
  const c = ((text || '') + ' ' + (artist || '') + ' ' + (title || '')).toLowerCase();
  const ppop = [
    'sb19', 'bini', 'alamat', 'maki', 'moira', 'lola amour', 'ben&ben', 'ben and ben',
    'tj monterde', 'arthur nery', 'zack tabudlo', 'cup of joe', 'juan karlos', 'dionela',
    'felip', 'josh cullen', 'bgyo', 'kaia', 'g22', 'dilaw', 'sunflower station', 'opm',
    'p-pop', 'ppop', 'tagalog', 'filipino', 'pinoy', 'mayonnaise', 'kamikazee', 'parokya', 'eraserheads'
  ];
  if (ppop.some(a => c.includes(a))) return true;

  const tagalogWords = [
    'ang', 'mga', 'sa', 'ng', 'ako', 'ikaw', 'mahal', 'kita', 'puso', 'bakit', 'ba', 'pa', 'na',
    'hindi', 'walang', 'sana', 'tayo', 'ko', 'mo', 'ka', 'naman', 'lang', 'kung', 'dahil', 'kasi',
    'kayo', 'natin', 'lahat', 'gabi', 'araw', 'panahon', 'buhay', 'pag-ibig', 'pagibig', 'tingin',
    'dito', 'doon', 'nandito', 'saan', 'kailan', 'kaylan', 'wala', 'meron', 'mayroon', 'liwanag',
    'dilim', 'hanggang', 'bawat', 'sandali', 'yakap', 'halik', 'mata', 'kamay', 'tinig', 'lungkot',
    'saya', 'ngiti', 'luha', 'ayaw', 'gusto', 'ibig', 'paalam', 'muli', 'kahapon', 'bukas', 'ngayon',
    'sayo', 'sa\'yo', 'atin', 'amin', 'samin', 'sa\'min', 'inyo', 'sinabi', 'sasabihin', 'nagmamahal'
  ];
  const words = c.split(/[\s,.\-!?"'()\[\]]+/);
  let hits = 0;
  for (const w of words) if (tagalogWords.includes(w)) hits++;
  return hits >= 2;
}

function isEnglishText(text) {
  const c = (text || '').toLowerCase();
  const englishWords = [
    'the', 'and', 'you', 'that', 'was', 'for', 'are', 'with', 'his', 'they', 'this', 'have',
    'from', 'one', 'had', 'word', 'what', 'some', 'we', 'can', 'out', 'other', 'were', 'all',
    'there', 'when', 'up', 'use', 'your', 'how', 'said', 'an', 'each', 'she', 'which', 'do',
    'their', 'time', 'if', 'will', 'way', 'about', 'many', 'then', 'them', 'would', 'like', 'so',
    'these', 'her', 'long', 'make', 'thing', 'see', 'him', 'two', 'has', 'look', 'more', 'day',
    'could', 'go', 'come', 'did', 'sound', 'no', 'most', 'people', 'my', 'over', 'know', 'water',
    'than', 'call', 'first', 'who', 'may', 'down', 'side', 'been', 'now', 'find', 'any', 'new',
    'part', 'take', 'get', 'place', 'made', 'live', 'where', 'after', 'back', 'little', 'only',
    'every', 'good', 'me', 'give', 'our', 'under', 'name', 'very', 'through', 'just', 'think',
    'say', 'help', 'much', 'before', 'move', 'right', 'too', 'same', 'tell', 'want', 'play'
  ];
  const words = c.split(/[\s,.\-!?"'()\[\]]+/);
  let hits = 0;
  for (const w of words) if (englishWords.includes(w)) hits++;
  return hits >= 4;
}

async function translateToEnglish(lines) {
  const out = [];
  const BATCH = 15;
  for (let i = 0; i < lines.length; i += BATCH) {
    const chunk = lines.slice(i, i + BATCH);
    const joined = chunk.map(s => s.trim() || '.').join(' \n===\n ');
    try {
      const url = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=en&dt=t&q=' + encodeURIComponent(joined);
      const res = await fetch(url);
      if (!res.ok) throw 0;
      const data = await res.json();
      const detected = data && data[2];
      // If detected as English, Tagalog, or Filipino: return null so we NEVER change it!
      if (detected === 'en' || detected === 'tl' || detected === 'fil') {
        return null;
      }
      let full = '';
      if (Array.isArray(data[0])) full = data[0].map(s => s[0]).join('');
      const split = full.split(/\s*===\s*/);
      for (let j = 0; j < chunk.length; j++) {
        const tr = split[j] ? split[j].trim() : '';
        out.push(tr && tr !== '.' ? tr : chunk[j]);
      }
    } catch (e) {
      chunk.forEach(c => out.push(c));
    }
  }
  return out;
}

// Always show original lyrics first
function showLyrics(track) {
  const tr = $('ly-track');
  tr.innerHTML = '';
  tr.style.transform = 'translateY(0px)';
  currentLyrics = track && track.lyrics ? track.lyrics : null;
  currentLyricIdx = -1;

  if (!track) {
    $('lyrics-status').textContent = 'Play a song to see its lyrics';
    return;
  }
  if (!track.lyrics) {
    $('lyrics-status').textContent = 'No lyrics saved for this song.';
    return;
  }

  $('lyrics-status').textContent = track.isTranslated 
    ? (track.lyrics.sy ? 'Synced lyrics' : 'Lyrics') + ' · Translated to English'
    : (track.lyrics.sy ? 'Synced lyrics' : 'Lyrics');

  track.lyrics.l.forEach((line, i) => {
    const p = document.createElement('p');
    p.className = 'ly-line';
    p.textContent = line || '♪';
    if (track.lyrics.sy) {
      p.onclick = () => {
        audio.currentTime = track.lyrics.t[i];
        currentLyricIdx = i;
        scrollLyrics(true);
      };
    }
    tr.appendChild(p);
  });

  scrollLyrics(false);
}

function syncLyrics(currTime) {
  if (!currentLyrics || !currentLyrics.sy) return;
  const k = currentLyrics.t.findLastIndex(time => time <= currTime);
  if (k === currentLyricIdx) return;

  const tr = $('ly-track');
  const ch = tr.children;
  if (ch[currentLyricIdx]) ch[currentLyricIdx].classList.remove('on');
  currentLyricIdx = k;
  if (ch[k]) {
    ch[k].classList.add('on');
    scrollLyrics(true);
  }
}

function scrollLyrics(isSmooth) {
  const tr = $('ly-track');
  const box = $('ly-container');
  if (!tr || !box) return;
  const d = tr.children[currentLyricIdx];
  if (!d) {
    tr.style.transform = 'translateY(0px)';
    return;
  }
  const target = box.clientHeight / 2 - (d.offsetTop + d.clientHeight / 2);
  tr.style.transition = isSmooth ? 'transform 0.65s cubic-bezier(0.2, 0.9, 0.3, 1)' : 'none';
  tr.style.transform = `translateY(${Math.round(target)}px)`;
}

// Manual Translate Button: Only translates when clicked, never alters English or Filipino songs
$('btn-translate').addEventListener('click', async () => {
  const t = playlist[currentIndex];
  if (!t || !t.lyrics || !t.lyrics.l || !t.lyrics.l.length) {
    toast('Play a song with lyrics first');
    return;
  }

  // If already translated
  if (t.isTranslated) {
    toast('Already translated to English');
    return;
  }

  const allLines = t.lyrics.l.join(' ');

  // 1. Check if Filipino / Tagalog / P-Pop
  if (isFilipinoOrTagalog(allLines, t.artist, t.title)) {
    toast('Filipino/Tagalog song — kept original');
    return;
  }

  // 2. Check if English
  if (isEnglishText(allLines)) {
    toast('Song is in English — kept original');
    return;
  }

  $('lyrics-status').textContent = 'Translating to English…';
  try {
    const trLines = await translateToEnglish(t.lyrics.l);
    if (trLines) {
      t.origLyrics = { ...t.lyrics, l: [...t.lyrics.l] };
      t.lyrics = { ...t.lyrics, l: trLines };
      t.isTranslated = true;
      showLyrics(t);
      $('lyrics-status').textContent = (t.lyrics.sy ? 'Synced lyrics' : 'Lyrics') + ' · Translated to English';
      toast('Lyrics translated to English');
    } else {
      $('lyrics-status').textContent = t.lyrics.sy ? 'Synced lyrics' : 'Lyrics';
      toast('Song is in English or Filipino — kept original');
    }
  } catch(e) {
    $('lyrics-status').textContent = t.lyrics.sy ? 'Synced lyrics' : 'Lyrics';
    toast('Translation unavailable');
  }
});

// Search lyrics online via lrclib.net
$('btn-find-online').addEventListener('click', async () => {
  const t = playlist[currentIndex];
  if (!t) {
    toast('Play a song first');
    return;
  }
  $('lyrics-status').textContent = 'Searching online…';

  const cleanTitle = (t.title || t.name)
    .replace(/\.[^/.]+$/, '')
    .replace(/[\(\[][^\)\]]*[\)\]]/g, ' ')
    .replace(/\b(official|video|audio|lyrics?|hd|hq|mv|music|remix|edit)\b/gi, ' ')
    .replace(/\s+/g, ' ')
    .trim();
  const cleanArtist = (t.artist || '').trim();

  const queries = [
    cleanArtist ? `${cleanArtist} ${cleanTitle}` : cleanTitle,
    cleanTitle
  ];

  let foundLyrics = null;
  for (const q of queries) {
    if (!q) continue;
    try {
      const res = await fetch(`https://lrclib.net/api/search?q=${encodeURIComponent(q)}`);
      if (res.ok) {
        const data = await res.json();
        if (Array.isArray(data) && data.length) {
          const best = data.find(r => r.syncedLyrics || r.plainLyrics) || data[0];
          const raw = best.syncedLyrics || best.plainLyrics;
          if (raw) {
            foundLyrics = parseLrc(raw);
            break;
          }
        }
      }
    } catch (e) {}
  }

  if (foundLyrics && foundLyrics.l.length) {
    t.lyrics = foundLyrics;
    currentLyrics = foundLyrics;
    currentLyricIdx = -1;
    t.trTested = false;
    showLyrics(t);
    $('lyrics-status').textContent = (foundLyrics.sy ? 'Synced lyrics' : 'Lyrics') + ' · from lrclib.net';
    toast('Lyrics found online');
  } else {
    $('lyrics-status').textContent = 'No lyrics found online';
    toast('No lyrics found online');
  }
});

function parseLrc(text) {
  const lines = [];
  const times = [];
  let synced = false;
  for (const raw of text.split(/\r?\n/)) {
    const m = raw.match(/\[(\d{1,3}):(\d{1,2}(?:\.\d{1,3})?)\]/);
    if (m) {
      synced = true;
      times.push(parseInt(m[1], 10) * 60 + parseFloat(m[2]));
      lines.push(raw.replace(/\[.*?\]/g, '').trim());
    } else if (!raw.startsWith('[') && raw.trim()) {
      lines.push(raw.trim());
    }
  }
  return { sy: synced ? 1 : 0, t: synced ? times : null, l: lines };
}

  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

    nextTrack();

    prevTrack();
  }
});
