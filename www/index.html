<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Music Player</title>
<style>
:root{--bg:#0a0a0f;--tx:#f4f4f7;--mu:#9a9aa8;--ac:#7dd3fc;--hv:rgba(255,255,255,.1);--pb:#f4f4f7;--pf:#111}
html,body{margin:0;height:100%;overflow:hidden;font:16px system-ui,sans-serif;color:var(--tx);background:var(--bg);user-select:none;-webkit-user-select:none}
#app{height:100%;display:flex;flex-direction:column;gap:16px;padding:20px;justify-content:center;align-items:center}
.card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,0.1);border-radius:20px;padding:24px;width:100%;max-width:400px;text-align:center;box-sizing:border-box}
h1{font-size:20px;margin:0 0 10px;word-break:break-all}
p{color:var(--mu);margin:0 0 20px;font-size:14px}
.ct{display:flex;justify-content:center;align-items:center;gap:16px;margin-bottom:20px}
.ib{background:var(--hv);border:1px solid rgba(255,255,255,0.2);color:var(--tx);padding:12px 20px;border-radius:99px;font-size:16px;cursor:pointer;font-weight:600}
.ib:active{background:var(--ac);color:#000}
.ib.pb{background:var(--ac);color:#000}
.pill{display:block;width:100%;padding:14px;border-radius:12px;background:var(--ac);color:#000;font-weight:700;border:0;cursor:pointer;margin-top:10px;box-sizing:border-box}
#debug{position:fixed;bottom:10px;left:10px;right:10px;background:rgba(0,0,0,0.8);color:#0ff;font-family:monospace;font-size:11px;padding:8px;border-radius:8px;max-height:80px;overflow:auto;pointer-events:none}
</style>
</head>
<body>

<div id="app">
  <div class="card">
    <h1 id="title">No Song Loaded</h1>
    <p id="sub">Tap a button or add music to test</p>
    
    <div class="ct">
      <button class="ib" id="pv">Prev</button>
      <button class="ib pb" id="pl">Play</button>
      <button class="ib" id="nx">Next</button>
    </div>

    <label class="pill">＋ Select Music Files
      <input id="fi" type="file" accept="audio/*" multiple style="display:none">
    </label>
  </div>
</div>

<div id="debug">App initialized...</div>

<script>
const log = m => {
  const d = document.getElementById('debug');
  if(d) d.innerText = m;
  console.log(m);
};

window.onerror = (msg, src, line) => {
  log("ERROR: " + msg + " (Line " + line + ")");
};

const $ = s => document.querySelector(s);
const audio = new Audio();
let playlist = [];
let currentIndex = 0;

$('#pl').onclick = () => {
  log("Play clicked. Playlist length: " + playlist.length);
  if(playlist.length === 0) {
    log("Please add music files first!");
    return;
  }
  if(audio.paused) {
    audio.play().then(() => log("Playing...")).catch(e => log("Play err: "+e.message));
    $('#pl').innerText = "Pause";
  } else {
    audio.pause();
    $('#pl').innerText = "Play";
    log("Paused");
  }
};

$('#nx').onclick = () => {
  log("Next clicked");
  if(playlist.length === 0) return;
  currentIndex = (currentIndex + 1) % playlist.length;
  playTrack(currentIndex);
};

$('#pv').onclick = () => {
  log("Prev clicked");
  if(playlist.length === 0) return;
  currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
  playTrack(currentIndex);
};

$('#fi').onchange = e => {
  const files = Array.from(e.target.files);
  log("Files selected: " + files.length);
  if(files.length > 0) {
    playlist = files;
    currentIndex = 0;
    playTrack(currentIndex);
  }
};

function playTrack(i) {
  const file = playlist[i];
  log("Loading: " + file.name);
  $('#title').innerText = file.name;
  audio.src = URL.createObjectURL(file);
  audio.play().then(() => {
    log("Now playing track " + (i+1));
    $('#pl').innerText = "Pause";
  }).catch(e => log("Audio load error: " + e.message));
}
</script>

</body>
</html>
