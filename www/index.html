async function translateLyricsArray(lines){
  const out=[];const BATCH=15;
  for(let i=0;i<lines.length;i+=BATCH){
    const chunk=lines.slice(i,i+BATCH);
    const joined=chunk.map(s=>s.trim()||".").join(" \n===\n ");
    try{
      const url="https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=en&dt=t&q="+encodeURIComponent(joined);
      const res=await fetch(url);
      if(!res.ok)throw 0;
      const data=await res.json();
      const detected=data&&data[2];
      if(i===0&&(detected==="en"||detected==="tl"||detected==="fil")){
        return null;
      }
      let full="";
      if(Array.isArray(data[0]))full=data[0].map(s=>s[0]).join("");
      const split=full.split(/\s*===\s*/);
      for(let j=0;j<chunk.length;j++){
        const tr=split[j]?split[j].trim():"";
        out.push(tr&&tr!=="."?tr:chunk[j]);
      }
    }catch(e){
      chunk.forEach(c=>out.push(c));
    }
  }
  return out;
}

async function tryAutoTranslate(t,force=false){
  if(!t||!t.ly||!t.ly.l||!t.ly.l.length)return;
  if(!force&&t.trTested)return;
  t.trTested=true;
  if(t.origLy&&force){
    t.ly=t.origLy;
    delete t.origLy;
    delete t.isTranslated;
    if(T[cur]===t){showLy();toast("Showing original lyrics");}
    return;
  }
  if(t.isTranslated&&!force)return;
  const sample=t.ly.l.slice(0,10).join(" ");
  if(!force&&isTagalogOrPPop(sample,t.artist,t.title))return;
  $("#lyst").textContent="Translating to English…";
  try{
    const trLines=await translateLyricsArray(t.ly.l);
    if(trLines){
      t.origLy={sy:t.ly.sy,t:t.ly.t,l:[...t.ly.l]};
      t.ly={sy:t.ly.sy,t:t.ly.t,l:trLines};
      t.isTranslated=true;
      if(T[cur]===t){
        showLy();
        $("#lyst").textContent=(t.ly.sy?"Synced lyrics":"Lyrics")+" · Translated to English";
        toast("Lyrics translated to English");
      }
    }else{
      $("#lyst").textContent=(t.ly.sy?"Synced lyrics":"Lyrics");
      if(force)toast("Song is already in English or Tagalog");
    }
  }catch(e){
    $("#lyst").textContent=(t.ly.sy?"Synced lyrics":"Lyrics");
  }
}
