name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor
        run: npm install

      - name: Create the Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Add the folder picker and the app icon
        run: |
          cp native/*.java android/app/src/main/java/com/musicplayer/app/
          pip install pillow
          python make_icons.py
          find android/app/src/main/res -name "ic_launcher*" | sort

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save the APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: music-player-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish Direct Mobile Download Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: latest
          name: "Music Player APK (Latest)"
          body: |
            ### 📱 Mobile Download:
            Tap **`app-debug.apk`** below to download and install directly on your Android phone.
          draft: false
          prerelease: false
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
